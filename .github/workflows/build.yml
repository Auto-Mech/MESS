name: Build and test

on:
  push:
    branches: ["**"]  # not tags: a release tag runs this workflow through release.yml
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  workflows:
    name: lint the workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.1
          environments: release
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'master' }}

      - name: Lint the GitHub Actions workflows
        run: pixi run workflows

  build-test:
    name: ${{ matrix.environment }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # default: linked against conda-forge libraries; static: no runtime dependencies
        environment: [default, static]
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.1
          environments: ${{ matrix.environment }}
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'master' }}

      # Installing the environment builds the package from source.
      - name: Test the examples
        run: pixi run -e ${{ matrix.environment }} test

      - name: Check that the executables are static
        if: matrix.environment == 'static'
        run: |
          for exe in .pixi/envs/static/bin/mess*; do
            if ldd "$exe"; then echo "$exe is dynamically linked"; exit 1; fi
          done

      - name: Upload the static executables
        if: matrix.environment == 'static'
        uses: actions/upload-artifact@v4
        with:
          name: mess-static-linux-64
          path: .pixi/envs/static/bin/mess*
