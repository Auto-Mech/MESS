[workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]
preview = ["pixi-build"]


[package]
name = "mess"
version = "2026.11.0"

[package.build.backend]
name = "pixi-build-cmake"
version = "0.*"

[package.build.config]
compilers = ["c", "cxx", "fortran"]
# MESS needs ILP64 (64-bit integer) BLAS/LAPACK. conda-forge's openblas-ilp64
# suffixes its symbols with 64_, which MESS_BLAS_SUFFIX maps to.
extra-args = [
    "-DBLAS_LIBRARIES=$PREFIX/lib/libopenblas64_.so",
    "-DLAPACK_LIBRARIES=$PREFIX/lib/libopenblas64_.so",
    "-DMESS_BLAS_SUFFIX=64_",
]

[package.host-dependencies]
openblas-ilp64 = "*"     # headers and libopenblas64_.so (no run-exports)
libopenblas-ilp64 = "*"  # runtime library (run-exports itself)
gsl = "*"

[tasks]
test = "bash tests/run-examples.sh"

# Two environments with the same executables:
#   default: dynamically linked against conda-forge libraries (this package)
#   static:  fully static executables, no runtime dependencies (static/recipe.yaml)
[feature.dynamic.dependencies]
mess = { path = "." }

[feature.static.dependencies]
mess-static = { path = "static" }

# Release tooling (see tbump.toml and RELEASING.md)
[feature.release.dependencies]
python = "*"
tbump = "*"

[feature.release.pypi-dependencies]
keepachangelog = "*"

[feature.release.tasks]
# Build both conda packages into dist/
build-conda = "pixi publish --target-dir dist && pixi publish --path static --target-dir dist"
# Publish them to prefix.dev, skipping files that were already uploaded, so that a
# failed release can be rerun
publish-conda = "pixi upload prefix --skip-existing --channel automech dist/*.conda"
# Initiate release
version = "tbump current-version"
changelog = { cmd = "keepachangelog release {{ version }}", args = ["version"] }
release = "tbump"

[environments]
default = ["dynamic"]
static = ["static"]
# Only the release tooling: this environment does not build MESS
release = { features = ["release"], no-default-feature = true }
